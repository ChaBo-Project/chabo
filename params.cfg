# LOCAL TEST CONFIG (branch api_generalization) — restore the sanitized template from
# scratchpad/params.cfg.template.backup before committing.

[hf_endpoints]
embedding_endpoint_url = https://f4veaarnbmqjhve9.eu-west-1.aws.endpoints.huggingface.cloud
reranker_endpoint_url = https://whikfgijnuog8fjv.eu-west-1.aws.endpoints.huggingface.cloud

[qdrant]
mode = native
url = https://de438521-e2dd-43d9-b41b-b2e18299a2c0.europe-west3-0.gcp.cloud.qdrant.io
port = 6333
collection = allreports

[retrieval]
top_k = 20
reranker_top_k = 5
reranker_enabled = true
hybrid_enabled = false

[generator]
PROVIDER = huggingface
MODEL = qwen/qwen3.5-35b-a3b
MAX_TOKENS = 2048
TEMPERATURE = 0.1
INFERENCE_PROVIDER = novita
ORGANIZATION = GIZ
CONTEXT_META_FIELDS = filename,project_id,document_source
TITLE_META_FIELDS = filename,page
LINK_META_FIELD = url
instance_guidelines_path =

[api]
model_name = chabo
openai_citations = true
document_ttl_seconds = 3600
max_documents = 100
max_upload_bytes = 26214400

[ingestor]
chunk_size = 700
chunk_overlap = 50
max_chunks = 20
separators = \n\n,\n,. ,! ,? , ,

[conversation_history]
MAX_TURNS = 3
MAX_CHARS = 8000

[metadata_filters]
# empty on purpose: FILTER_VALUES is Egypt-agriculture specific and `allreports` has no
# payload keyword index (filtered search 400s). Pass-through extraction.
filterable_fields =

[query_rewriter]
enabled = false
db_context_path = db_context.yaml
target_language =

[input_guard]
enabled = false
mode = llm
endpoint_url =
model = Qwen/Qwen3Guard-Gen-0.6B
llm_provider = huggingface
llm_model = meta-llama/llama-3.1-8b-instruct
llm_max_tokens = 64
llm_temperature = 0.0
llm_inference_provider = novita
llm_organization = GIZ
block_controversial = false
timeout_s = 8.0
blocked_message = I'm sorry, but I can't help with that request.

[output_guard]
classification_enabled = false
mode = llm
endpoint_url =
model = Qwen/Qwen3Guard-Gen-0.6B
window_chars = 200
block_controversial = true
timeout_s = 5.0
classification_message = This application is not able to answer certain queries. Please try again.
guideline_enforcement = off
llm_provider = huggingface
llm_model = meta-llama/llama-3.1-8b-instruct
llm_max_tokens = 64
llm_temperature = 0.0
llm_inference_provider = novita
llm_organization = GIZ
blocklist_enabled = true
blocklist_path = src/components/guardrails/blocklist.txt
blocklist_message = There was an error in the output. Please try again.
